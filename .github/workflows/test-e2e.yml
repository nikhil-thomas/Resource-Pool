name: E2E Tests

on:
  pull_request:

jobs:
  test-e2e:
    name: Run on Ubuntu
    runs-on: ubuntu-latest

    env:
      # Image built locally inside the runner and loaded into Kind — no registry push needed.
      MANAGER_IMAGE: resource-pool:e2e-pr-${{ github.event.pull_request.number }}
      # Kind cluster name — unique per PR to avoid collisions on self-hosted runners.
      KIND_CLUSTER: resource-pool-pr-${{ github.event.pull_request.number }}
      # This operator has no webhooks, so CertManager is not required.
      CERT_MANAGER_INSTALL_SKIP: "true"

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Install Kind
        run: |
          curl -Lo ./kind https://kind.sigs.k8s.io/dl/latest/kind-linux-$(go env GOARCH)
          chmod +x ./kind
          sudo mv ./kind /usr/local/bin/kind
          kind version

      - name: Run e2e tests
        # BeforeSuite builds the image with `make docker-build IMG=$MANAGER_IMAGE`,
        # loads it into Kind with `kind load docker-image`, then the suite deploys
        # and tests the operator. KIND_CLUSTER controls which cluster to create/use.
        run: |
          go mod tidy
          MANAGER_IMAGE=${{ env.MANAGER_IMAGE }} \
          KIND_CLUSTER=${{ env.KIND_CLUSTER }} \
          CERT_MANAGER_INSTALL_SKIP=${{ env.CERT_MANAGER_INSTALL_SKIP }} \
          make test-e2e
