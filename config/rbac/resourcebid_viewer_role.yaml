# This rule is not used by the project resource-pool itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants read-only access to pool.dataverse.redhat.com resources.
# This role is intended for users who need visibility into these resources
# without permissions to modify them. It is ideal for monitoring purposes and limited-access viewing.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: resource-pool
    app.kubernetes.io/managed-by: kustomize
  name: resourcebid-viewer-role
rules:
- apiGroups:
  - pool.dataverse.redhat.com
  resources:
  - resourcebids
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - pool.dataverse.redhat.com
  resources:
  - resourcebids/status
  verbs:
  - get
