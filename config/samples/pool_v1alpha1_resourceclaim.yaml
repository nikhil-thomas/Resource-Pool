apiVersion: pool.dataverse.redhat.com/v1alpha1
kind: ResourceClaim
metadata:
  labels:
    app.kubernetes.io/name: resource-pool
    app.kubernetes.io/managed-by: kustomize
  name: resourceclaim-sample
spec:
  # Type of resource to claim (e.g., "snowflake", "postgres", "aws-account")
  type: snowflake

  # How long to hold the resource (optional, defaults to 1h)
  leaseDuration: 1h

  # Filter resources by labels (optional)
  requiredLabels:
    tier: standard
